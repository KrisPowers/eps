[package]
name = "cli"
description = "Read-only recon CLI: point it at a host and it reports exposed ports, discoverable endpoints, and their auth/TLS/rate-limit posture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["security", "recon", "network", "scanner", "cli"]
categories = ["command-line-utilities"]

# Installed as `@` (see install.sh, install.ps1 and the Homebrew formula), so the
# typed command is `@`. A crate or binary can't be named `@`: rustc reads
# `@`-prefixed arguments as argument files.
[[bin]]
name = "eps"
path = "src/main.rs"

[dependencies]
scanner.workspace = true
endpoints.workspace = true
report.workspace = true
clap.workspace = true
futures.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
anyhow.workspace = true
