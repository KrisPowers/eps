[package]
name = "cli"
description = "Read-only recon CLI: point it at a host and it reports exposed ports, discoverable endpoints, and their auth/TLS/rate-limit posture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["security", "recon", "network", "scanner", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "portscan"
path = "src/main.rs"

[dependencies]
scanner.workspace = true
endpoints.workspace = true
report.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
anyhow.workspace = true
