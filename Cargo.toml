[package]
name = "at"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Read-only recon CLI: point it at an IP with @ and it reports exposed ports, discoverable endpoints, and their auth/TLS/rate-limit posture."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/krispowers/at"
keywords = ["security", "recon", "network", "scanner", "cli"]
categories = ["command-line-utilities"]
# The crate compiles as `at` (a `@` crate name is rejected by rustc, which
# reads `@`-prefixed tokens as argument files). The binary is installed as `@`
# (see install.sh / install.ps1 / the Homebrew formula), so the typed command
# is `@`.
default-run = "at"

[[bin]]
name = "at"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
