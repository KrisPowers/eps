[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/KrisPowers/portscan"

[workspace.dependencies]
scanner = { path = "crates/scanner" }
endpoints = { path = "crates/endpoints" }
report = { path = "crates/report" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
