name: release

# Builds prebuilt binaries for each supported target and attaches them to the
# GitHub Release when a version tag is pushed. The curl/PowerShell installers
# and the Homebrew formula download these archives.
#
# The archives ship the binary under its compiled name `at`; the installers
# rename it to `@` at install time.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: "!contains(matrix.target, 'windows')"
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/at"
          tar -czf "at-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" at
          shasum -a 256 "at-${{ matrix.target }}.tar.gz" | tee "at-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (windows)
        if: "contains(matrix.target, 'windows')"
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/at.exe"
          7z a "at-${{ matrix.target }}.zip" "$bin"
          certutil -hashfile "at-${{ matrix.target }}.zip" SHA256 > "at-${{ matrix.target }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: at-${{ matrix.target }}
          path: |
            at-${{ matrix.target }}.*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
